# MCP rate limit, keyed on the visitor's IP. Cloudflare and the Coolify proxy sit in front, so
# $remote_addr is a proxy address; prefer CF-Connecting-IP when present.
map $http_cf_connecting_ip $mcp_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $mcp_client zone=mcp:1m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/json application/javascript application/xml application/rss+xml application/manifest+json;

    # TLS ends at the proxy, so absolute redirects would point at http://. Send relative Location headers.
    absolute_redirect off;

    # Sitemap compatibility — redirect /sitemap.xml to the Astro-generated sitemap index
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Pages: trailing slash enforced, then files, directories, 404 (error_page below). Exact-match locations
    # such as /mcp never reach this block, so they need no exemption.
    location / {
        # OPTIONS (an agent asking what a page allows): 204 with Allow instead of nginx's 405 page. The add_header
        # here drops the inherited security headers, so the include repeats them.
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }
        rewrite ^([^.]*[^/])$ $1/ permanent;
        try_files $uri $uri/ =404;
    }

    # Extensionless agent policy is plain text, not a download
    location = /.well-known/agent-policy {
        default_type text/plain;
        include /etc/nginx/snippets/agent-file-headers.conf;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/agent-file-headers.conf;
    }

    # API endpoint. ^~ keeps the file-type locations below from taking /api/*.json.
    location ^~ /api/ {
        default_type application/json;
        # /api/ itself answers with the endpoint index written by generate-api.ts
        index index.json;
        # Security headers, the 1 h Cache-Control and Access-Control-Allow-Origin, as for the other agent files
        include /etc/nginx/snippets/agent-file-headers.conf;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        # Conditional GETs from a browser send If-None-Match, which needs a preflight
        add_header Access-Control-Allow-Headers "If-None-Match, If-Modified-Since";
        add_header Access-Control-Expose-Headers "ETag, Last-Modified, X-RateLimit-Limit, X-RateLimit-Window, X-RateLimit-Policy";
        add_header Access-Control-Max-Age "86400";
        # Rate-limit guidance for automated clients (static site; no server-side enforcement)
        add_header X-RateLimit-Limit "60";
        add_header X-RateLimit-Window "60";
        add_header X-RateLimit-Policy "60;w=60";
        # Unknown API paths answer in JSON, not with an HTML error page
        error_page 403 404 = @api_not_found;
    }

    location @api_not_found {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not_found","message":"No such API resource.","docs":"https://kin.rag.wtf/api/openapi.json"}\n';
    }

    # MCP server (Streamable HTTP, stateless, read-only), run by Node inside this container
    location = /mcp {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # The enforced limit, so clients can pace themselves before a 429 (mirrors MCP_RATE_LIMIT)
        add_header RateLimit-Policy "60;w=60;burst=30" always;
        limit_req zone=mcp burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @mcp_rate_limited;
        error_page 413 = @mcp_too_large;
        error_page 502 503 504 = @mcp_unavailable;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # HIRE check MCP server (same Node process, same rules): a copy of /mcp. It uses the same zone, so one client's
    # 60/min budget is shared across /mcp and /mcp/hire (the HIRE manifest says so). The server never logs bodies.
    location = /mcp/hire {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header RateLimit-Policy "60;w=60;burst=30" always;
        limit_req zone=mcp burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @mcp_rate_limited;
        error_page 413 = @mcp_too_large;
        error_page 502 503 504 = @mcp_unavailable;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @mcp_rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "60" always;
        add_header Access-Control-Allow-Origin * always;
        return 429 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Rate limit exceeded: 60 requests per minute. Retry after 60 seconds."},"id":null}\n';
    }

    location @mcp_too_large {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        return 413 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Request body too large: the limit is 64 KB."},"id":null}\n';
    }

    location @mcp_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "5" always;
        add_header Access-Control-Allow-Origin * always;
        return 503 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"MCP server is restarting. Retry shortly."},"id":null}\n';
    }

    # Markdown versions of pages (generate-api.ts writes <page>/index.md). The HTML page stays the canonical URL,
    # so search engines that find the copy (it is linked as rel=alternate) do not index it as a duplicate.
    location ~* ^(?<md_page>.*/)index\.md$ {
        types { }
        default_type text/markdown;
        include /etc/nginx/snippets/agent-file-headers.conf;
        add_header Link "<https://kin.rag.wtf$md_page>; rel=\"canonical\"";
    }

    # Agent and feed files (llms.txt, robots.txt, sitemaps, RSS, .well-known JSON, ai-plugin.json, the résumé):
    # not fingerprinted, so a short explicit cache instead of whatever a proxy picks, and readable cross-origin.
    location ~* \.(txt|xml|json|webmanifest|pdf)$ {
        include /etc/nginx/snippets/agent-file-headers.conf;
    }

    # Build output with content hashes in the file names: cache for a year
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other static files keep their names when replaced (favicons, /images/, the og:image): fresh for a day, then
    # served from cache while a background revalidation (ETag) picks up any replacement
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # HTML pages — short cache
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;

    # Security headers for locations that set no add_header of their own
    include /etc/nginx/snippets/security-headers.conf;

    # Custom 404 page; directories without an index (e.g. /images/) are not found either, not forbidden
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}

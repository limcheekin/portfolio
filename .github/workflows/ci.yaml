name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the sitemap's lastmod dates come from git (scripts/sitemap-lastmod.mjs)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/api/portfolio.json
          test -f dist/api/openapi.json
          test -f dist/llms-full.txt
          test -f dist/llms.txt
          test -f dist/ai-plugin.json
          test -f dist/robots.txt
          test -f build/mcp/server.mjs
          echo "Build artifacts verified"

      - name: MCP server smoke test
        run: |
          PORTFOLIO_DIR=dist node build/mcp/server.mjs &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3001/healthz && break; sleep 0.5; done
          npm run mcp:smoke -- http://127.0.0.1:3001/mcp

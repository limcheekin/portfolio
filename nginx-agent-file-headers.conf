# Headers for agent-readable files that are not fingerprinted (included by nginx.conf). Includes the security
# headers, because a location with its own add_header drops the inherited ones.
include /etc/nginx/snippets/security-headers.conf;
add_header Cache-Control "public, max-age=3600, must-revalidate";
add_header Access-Control-Allow-Origin *;
add_header Allow "GET, HEAD, OPTIONS";
# OPTIONS (CORS preflight, or an agent asking what is allowed): 204 carrying the headers above
if ($request_method = OPTIONS) {
    return 204;
}
